<style>
:root{
  --ink:#1E1433;--ink2:#3A3350;--muted:#625C74;--line:#E7E3F0;--line2:#F0EDF6;--bg:#F6F4FA;
  --purple:#6B2FD6;--purple-d:#5B21B6;--purple-dd:#3F1D8F;--teal:#087B77;--teal-d:#05605C;
  --track:#ECE8F4;--magenta:#9D1F8C;--alert:#A3204F;--mint:#7FE0D9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Montserrat',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink)}
button,input,textarea{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8B5CF6;outline-offset:2px}
h1,h2,h3{margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-left:24px;padding-right:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.eyebrow.teal{color:var(--teal)}
.muted{color:var(--muted)}
.track{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.track>span{display:block;height:100%;background:var(--teal);border-radius:999px}
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--track)}
.stack>span{display:block;height:100%}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.sq{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:0;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--purple);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{background:#fff;border:1px solid #D9D3E8;color:var(--purple-dd);font-weight:600}
.btn.outline{background:#fff;border:1.5px solid var(--purple);color:var(--purple-d)}
.btn.mint{background:var(--mint);color:var(--ink);border-radius:999px}
.pill{min-height:40px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid #D9D3E8;background:#fff;color:var(--purple-dd)}
.pill.on{background:var(--purple);border-color:var(--purple);color:#fff}
.pill.sm{min-height:36px;padding:0 12px;font-size:12px}
.pill.sq10{border-radius:10px}
.seg{display:inline-flex;flex-wrap:wrap;padding:4px;border-radius:12px;background:#F0EDF6;gap:4px}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer}
.seg button.on{background:#fff;color:var(--purple-dd)}
.field{display:flex;flex-direction:column;gap:8px}
.field>.lbl{font-size:12.5px;font-weight:700}
textarea.inp,input.inp{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #D9D3E8;font-size:13.5px;line-height:1.5;background:#fff}
textarea.inp{resize:vertical}
.grid-auto{display:grid;gap:16px}
.xl{min-width:1600px}
.xl-row{display:grid;grid-template-columns:104px 100px 168px minmax(270px,2fr) minmax(270px,2fr) 96px 92px 112px 112px 104px 132px}
.xl-head span{padding:12px;border-right:1px solid rgba(255,255,255,.15)}
.xl-body>span{padding:10px 12px;border-right:1px solid #ECE9F2}
.xl-head span:last-child,.xl-body>span:last-child{border-right:0}
.lvl{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
</style>
</head>

  function initFiles() { return JSON.parse(JSON.stringify(INIT_FILES)); }

  /* ================= Estado + persistencia local ================= */
  var KEY = 'knowledge-seguimiento-poc-v2';
  var state = {
    view: 'resumen', sub: 'plans', grp: null, panel: null, pid: null, rid: null, form: null,
    mview: 'tabla', ms: 'all', mx: 'riesgo', mcrit: 'all', mplan: 'all', q: '',
    status: initStatus(), files: initFiles(), added: [], edits: {}
  };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.status) { state.status = saved.status; state.files = saved.files || state.files; state.added = saved.added || []; state.edits = saved.edits || {}; }
  } catch (e) { /* sin almacenamiento disponible */ }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify({ status: state.status, files: state.files, added: state.added, edits: state.edits })); } catch (e) { /* ignorar */ }
  }
  function set(patch) { Object.assign(state, patch); render(); }

  /* ================= Utilidades ================= */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pct(a, t) { return t ? Math.round(a / t * 100) : 0; }
  function act(name, arg) { return 'data-act="' + name + '"' + (arg != null ? ' data-arg="' + esc(arg) + '"' : ''); }
  function sug(I, Pr) { var v = { A: 3, M: 2, B: 1 }; var s = v[I] * v[Pr]; return s >= 6 ? 'Alto' : (s >= 3 ? 'Medio' : 'Bajo'); }
  function riskZone(I, Pr) { return 'Riesgo ' + sug(I, Pr).toLowerCase(); }
  function priorZone(I, C) {
    var hiI = I === 'A', hiC = C === 'A';
    if (hiI && !hiC) { return 'Quick win'; }
    if (hiI && hiC) { return 'Proyecto estratégico'; }
    if (!hiI && !hiC) { return 'Complementario'; }
    return 'Evaluar / replantear';
  }
  function critStyle(c) {
    if (c === 'Alto') { return { bg: '#9D1F8C', fg: '#FFFFFF' }; }
    if (c === 'Medio') { return { bg: '#F6DDF1', fg: '#7A1670' }; }
    return { bg: '#EFEDF3', fg: '#4F4B63' };
  }
  function critBadge(c) { var s = critStyle(c); return '<span class="badge" style="background:' + s.bg + ';color:' + s.fg + '">' + esc(c) + '</span>'; }
  function chip(t) { return '<span class="chip" style="background:' + t.bg + ';color:' + t.fg + '"><span class="dot" style="background:' + t.dot + '"></span>' + t.label + '</span>'; }
  function track(p, h) { return '<div class="track" style="height:' + (h || 8) + 'px"><span style="width:' + p + '%"></span></div>'; }
  function pills(list, cls) {
    return list.map(function (o) {
      return '<button type="button" class="pill ' + (cls || '') + (o.on ? ' on' : '') + '" aria-pressed="' + (o.on ? 'true' : 'false') + '" ' + act(o.act, o.arg) + (o.title ? ' title="' + esc(o.title) + '"' : '') + '>' + o.label + '</button>';
    }).join('');
  }
  function allRecs() {
    var apply = function (r) { var e = state.edits[r.code]; return e ? Object.assign({}, r, e) : r; };
    return BASE_RECS.map(apply).concat(state.added.map(apply));
  }
  function nextCode(group) {
    var pre = PREFIX[group], max = 0;
    allRecs().forEach(function (r) {
      if (r.code.indexOf(pre) === 0) { var n = parseInt(r.code.slice(pre.length), 10); if (!isNaN(n) && n > max) { max = n; } }
    });
    var num = max + 1;
    if (pre.indexOf('R-') === 0) { return pre + num; }
    return pre + (num < 10 ? '00' + num : (num < 100 ? '0' + num : String(num)));
  }
  var ICON = {
    cal: '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    close: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    file: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B2FD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
    check: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    info: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
    warn: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M12 3l9.5 16.5h-19z"/><path d="M12 10v4M12 17h.01"/></svg>',
    back: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
    plus: '<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    edit: '<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>'
  };

  /* ================= Cálculos ================= */
  function compute() {
    var raw = allRecs();
    var tiVals = raw.filter(function (r) { return r.diag === 'ti'; }).map(function (r) { return state.status[r.code] || 0; });
    var itgc = tiVals.every(function (v) { return v === 3; }) ? 3 : (tiVals.some(function (v) { return v > 0; }) ? 1 : 0);
    var recs = raw.map(function (r) {
      var st = r.code === 'ITGC' ? itgc : (state.status[r.code] || 0);
      var isItgc = r.code === 'ITGC';
      return Object.assign({}, r, { st: st, t: ST[st], isItgc: isItgc, noPlan: !r.plan && !isItgc, groupName: GNAME[r.group] });
    });
    var plans = PLANS.map(function (p) {
      var rs = recs.filter(function (r) { return r.plan === p.id; });
      var cov = rs.filter(function (r) { return r.st === 3; }).length;
      var any = rs.some(function (r) { return r.st > 0; });
      var closed = rs.length > 0 && cov === rs.length;
      return Object.assign({}, p, { recs: rs, cov: cov, tot: rs.length, closed: closed, any: any,
        stateLabel: closed ? 'Cerrado' : (any ? 'En curso' : 'No iniciado'), sc: closed ? ST[3] : (any ? ST[1] : ST[0]) });
    });
    function diag(d) {
      var isCI = d === 'ci';
      var rs = recs.filter(function (r) { return r.diag === d; });
      var counts = [0, 0, 0, 0];
      rs.forEach(function (r) { counts[r.st] += 1; });
      var ps = plans.filter(function (x) { return x.diag === d; });
      var inPlans = rs.filter(function (r) { return !!r.plan; }).length;
      var noPlan = rs.filter(function (r) { return r.noPlan; });
      var note = 'Son ' + rs.length + ' recomendaciones: ' + inPlans + ' están en los 8 planes';
      if (isCI) { note += ', ITGC se cubre con los planes del diagnóstico de TI'; }
      note += noPlan.length ? (' y ' + noPlan.length + (noPlan.length === 1 ? ' aún no tiene' : ' aún no tienen') + ' plan de acción.') : '.';
      return {
        key: d, recs: rs, counts: counts, plans: ps, noPlan: noPlan, note: note,
        closed: ps.filter(function (x) { return x.closed; }).length,
        pct: pct(counts[3], rs.length),
        eyebrow: isCI ? 'Diagnóstico 1 · Marco COSO' : 'Diagnóstico 2 · ITGC y Ciberseguridad',
        title: isCI ? 'Control Interno' : 'Tecnología de la Información',
        full: isCI ? 'Diagnóstico de Control Interno' : 'Diagnóstico de Tecnología de la Información',
        groupWord: isCI ? 'componente' : 'proceso',
        cols: GROUPS[d].map(function (g) {
          var gr = rs.filter(function (r) { return r.group === g.id; });
          return { g: g, recs: gr, cov: gr.filter(function (r) { return r.st === 3; }).length };
        })
      };
    }
    return { recs: recs, plans: plans, ci: diag('ci'), ti: diag('ti') };
  }

  /* ================= Vistas ================= */
  function stackBar(d) {
    return '<div class="stack">' + [3, 2, 1, 0].filter(function (o) { return d.counts[o] > 0; }).map(function (o) {
      return '<span style="width:' + (d.counts[o] / d.recs.length * 100).toFixed(2) + '%;background:' + ST[o].bar + '"></span>';
    }).join('') + '</div>';
  }
  function legend(d, inline) {
    return [3, 2, 1, 0].map(function (o) {
      return inline
        ? '<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)"><span class="sq" style="background:' + ST[o].bar + '"></span>' + ST[o].long + ' · <strong>' + d.counts[o] + '</strong></span>'
        : '<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)"><span class="sq" style="background:' + ST[o].bar + '"></span><span style="flex-grow:1">' + ST[o].long + '</span><strong>' + d.counts[o] + '</strong></div>';
    }).join('');
  }
  function cardBorder(r) { return r.noPlan ? '#F0C2E4' : (r.st === 3 ? '#A7DCD7' : 'var(--line)'); }
  function cardBg(r) { return r.st === 3 ? '#F3FBFA' : '#fff'; }
  function attrShort(r) { return 'Imp. ' + IMP[r.I] + ' · Prob. ' + LVL[r.P] + ' · Compl. ' + LVL[r.C]; }
  function planShort(r) { return r.plan ? r.plan : (r.isItgc ? 'Vía diagnóstico TI' : 'Sin plan asignado'); }
  function newTag() { return '<span style="font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--mint);color:var(--ink)">NUEVA</span>'; }

  function kpi(label, value, color, sub, extra, border) {
    return '<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:10px' + (border ? ';border-color:' + border : '') + '">' +
      '<span class="eyebrow">' + label + '</span>' +
      '<span style="font-size:40px;font-weight:700;line-height:1;color:' + color + '">' + value + '</span>' +
      (extra || '') + '<span class="muted" style="font-size:12px;line-height:1.45">' + sub + '</span></div>';
  }

  function viewResumen(c) {
    var total = c.recs.length;
    var covered = c.recs.filter(function (r) { return r.st === 3; }).length;
    var gp = pct(covered, total);
    var altoAll = c.recs.filter(function (r) { return r.crit === 'Alto'; });
    var altoPend = altoAll.filter(function (r) { return r.st !== 3; }).length;
    var rev = c.recs.filter(function (r) { return r.st === 2; }).length;
    var noPlan = c.recs.filter(function (r) { return r.noPlan; });

    var wk = WEEKS.map(function (w) { return { lbl: w[0], v: w[1], cur: false }; }).concat([{ lbl: 'Actual', v: gp, cur: true }]);
    var maxV = Math.max.apply(null, wk.map(function (w) { return w.v; }));
    var tmax = Math.max(40, Math.ceil(maxV / 10) * 10 + 10);

    var h = '<div style="display:flex;flex-direction:column;gap:24px">';
    h += '<div class="grid-auto" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">';
    h += kpi('Cumplimiento global', gp + '%', 'var(--purple-d)', covered + ' de ' + total + ' recomendaciones cubiertas con evidencia validada', track(gp));
    h += kpi('Planes cerrados', (c.ci.closed + c.ti.closed) + ' / ' + c.plans.length, 'var(--teal)', 'Control Interno: ' + c.ci.closed + ' de 8 · TI: ' + c.ti.closed + ' de 8');
    h += kpi('Criticidad alta pendiente', altoPend, 'var(--magenta)', 'de ' + altoAll.length + ' recomendaciones de criticidad Alta aún sin cubrir');
    h += kpi('Evidencias por validar', rev, 'var(--purple)', 'Cargadas por el equipo y pendientes de validación.');
    h += kpi('Sin plan de acción', noPlan.length, noPlan.length ? 'var(--alert)' : 'var(--teal)', 'Recomendaciones que aún no están cubiertas por ningún plan.', '', noPlan.length ? '#F0C2E4' : '');
    h += '</div>';

    if (noPlan.length) {
      h += '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 18px;border-radius:14px;background:#FBE7F5;border:1px solid #F0C2E4;color:#6E1563">' + ICON.warn +
        '<span style="font-size:13.5px;font-weight:600;flex:1 1 260px">' + (noPlan.length === 1 ? 'Hay 1 recomendación sin plan de acción. Considérala para los siguientes planes.' : 'Hay ' + noPlan.length + ' recomendaciones sin plan de acción. Considéralas para los siguientes planes.') + '</span>' +
        '<span style="display:flex;flex-wrap:wrap;gap:6px">' + noPlan.map(function (r) {
          return '<button type="button" ' + act('rec', r.code) + ' style="min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #E3A9D6;background:#fff;color:#6E1563;font-size:12px;font-weight:700;cursor:pointer">' + esc(r.code) + '</button>';
        }).join('') + '</span></div>';
    }

    h += '<div class="grid-auto" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">';
    [c.ci, c.ti].forEach(function (d) {
      h += '<div class="card" style="padding:24px;display:flex;flex-direction:column;gap:16px">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow teal">' + d.eyebrow + '</span><span style="font-size:20px;font-weight:700">' + d.title + '</span></div>' +
        '<span style="font-size:32px;font-weight:700;color:var(--purple-d);line-height:1">' + d.pct + '%</span></div>' +
        stackBar(d) +
        '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px">' + legend(d) + '</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line2)">' +
        '<span class="muted" style="font-size:12px">' + d.counts[3] + ' de ' + d.recs.length + ' recomendaciones cubiertas · ' + d.closed + ' de ' + d.plans.length + ' planes cerrados</span>' +
        '<button type="button" class="btn primary" ' + act('view', d.key) + '>Ver detalle</button></div></div>';
    });
    h += '</div>';

    h += '<div style="display:flex;flex-wrap:wrap;gap:16px">';
    h += '<div class="card" style="flex:1 1 420px;min-width:0;padding:24px;display:flex;flex-direction:column;gap:12px">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><span style="font-size:16px;font-weight:700">Tendencia semanal de cumplimiento</span><span class="muted" style="font-size:11px">Escala 0–' + tmax + '% · cortes de los viernes</span></div>' +
      '<div style="display:flex;align-items:flex-end;gap:10px;height:210px;border-bottom:1px solid var(--line)">' +
      wk.map(function (w) {
        return '<div style="flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px">' +
          '<span style="font-size:11px;font-weight:700;color:' + (w.cur ? 'var(--purple-d)' : 'var(--muted)') + '">' + w.v + '%</span>' +
          '<div style="width:100%;max-width:44px;height:' + Math.max(4, Math.round(w.v / tmax * 170)) + 'px;background:' + (w.cur ? 'var(--purple)' : '#CDBDF4') + ';border-radius:8px 8px 0 0"></div></div>';
      }).join('') + '</div>' +
      '<div style="display:flex;gap:10px">' + wk.map(function (w) { return '<span class="muted" style="flex:1 1 0;min-width:0;text-align:center;font-size:11px">' + w.lbl + '</span>'; }).join('') + '</div>' +
      '<span class="muted" style="font-size:12px;line-height:1.5">Cada barra es la foto que se guarda al cerrar el corte semanal. La barra morada es el estado actual.</span></div>';
    h += '<div class="card" style="flex:1 1 420px;min-width:0;padding:24px;display:flex;flex-direction:column;gap:16px"><span style="font-size:16px;font-weight:700">Avance por componente y proceso</span>';
    [c.ci, c.ti].forEach(function (d) {
      h += '<div style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow teal">' + d.title + '</span>' +
        d.cols.map(function (col) {

        }).join('') + '</div>';
    });
    h += '</div></div></div>';
    return h;
  }

  function bubble(p) {
    var bg = p.closed ? 'var(--teal)' : '#fff';

    return '<button type="button" ' + act('plan', p.id) + ' aria-label="' + esc(p.id + ' ' + p.name) + '" style="width:52px;height:52px;border-radius:50%;background:' + bg + ';color:' + fg + ';border:3px solid ' + bd + ';outline:' + ol + ';outline-offset:3px;font-weight:700;font-size:14px;cursor:pointer">' + p.short + '</button>';
  }

  function viewDiagPlans(d) {
    var h = '<div style="display:flex;flex-direction:column;gap:24px">';

      '<div class="grid-auto" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">' +
      d.cols.map(function (col) {
        return '<button type="button" ' + act('recs', col.g.id) + ' class="card" style="display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;padding:16px;cursor:pointer;border-radius:14px">' +
          '<span class="eyebrow" style="color:var(--purple)">' + col.g.n + '</span>' +
          '<span style="font-size:14px;font-weight:700;line-height:1.3;min-height:36px">' + col.g.name + '</span>' +
          '<span style="display:flex;align-items:baseline;gap:6px"><span style="font-size:24px;font-weight:700;color:var(--teal)">' + col.cov + '/' + col.recs.length + '</span><span class="muted" style="font-size:12px">cubiertas</span></span>' +
          '<span style="display:block;width:100%">' + track(pct(col.cov, col.recs.length), 6) + '</span>' +
          '<span style="display:flex;flex-wrap:wrap;gap:4px">' + col.recs.map(function (r) { return '<span class="sq" style="background:' + r.t.dot + '"></span>'; }).join('') + '</span>' +
          '<span style="font-size:12px;font-weight:600;color:var(--purple-d)">Ver recomendaciones</span></button>';
      }).join('') + '</div></div>';

    h += '<div style="display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:12px;background:#F3EEFD;color:var(--purple-dd);font-size:13px;line-height:1.5">' + ICON.info + '<span>' + d.note + '</span></div>';

    if (d.noPlan.length) {
      h += '<div class="card" style="border-color:#F0C2E4;padding:20px;display:flex;flex-direction:column;gap:12px">' +
        '<div style="display:flex;flex-direction:column;gap:4px"><h3 style="font-size:16px;font-weight:700;color:#6E1563">Recomendaciones sin plan de acción</h3><span class="muted" style="font-size:12.5px">Insumo para los siguientes planes: asígnalas a un plan existente o agrúpalas en uno nuevo.</span></div>' +
        d.noPlan.map(function (r) {
          return '<button type="button" ' + act('rec', r.code) + ' style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid #F3D7EC;background:#FFF8FC;cursor:pointer">' +
            '<span style="font-size:13px;font-weight:700;width:76px">' + esc(r.code) + '</span><span style="flex:999 1 260px;min-width:0;font-size:13px;line-height:1.4">' + esc(r.title) + '</span>' + critBadge(r.crit) +
            '<span class="muted" style="font-size:11.5px">' + attrShort(r) + '</span></button>';
        }).join('') + '</div>';

      }).join('') + '</div>'

  function drawer(headBg, headHtml, bodyHtml, label) {

      '<h2 style="font-size:22px;font-weight:700;line-height:1.25">' + p.name + '</h2><p style="margin:0;font-size:13px;line-height:1.55">' + p.desc + '</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px"><span class="badge" style="background:rgba(255,255,255,.18);padding:4px 10px">' + (p.quad === 'qw' ? 'Quick win' : 'Proyecto estratégico') + '</span><span class="badge" style="background:rgba(255,255,255,.18);padding:4px 10px">Esfuerzo: ' + p.effort + '</span>' +
      (p.prio ? '<span class="badge" style="background:#fff;color:var(--alert);padding:4px 10px">Prioritario</span>' : '') + '</div>';

      '<span class="badge" style="background:' + p.sc.bg + ';color:' + p.sc.fg + ';padding:4px 10px">' + p.stateLabel + '</span></div>' + track(pct(p.cov, p.tot), 10) + '</div>' +
      '<span class="eyebrow">Recomendaciones del plan</span>';
    p.recs.forEach(function (r) {
      body += '<div style="border:1px solid ' + cardBorder(r) + ';background:' + cardBg(r) + ';border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px">' +
        '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px"><span style="font-size:14px;font-weight:700">' + esc(r.code) + '</span>' + critBadge(r.crit) + '<span style="flex-grow:1"></span>' + chip(r.t) + '</div>' +
        '<span style="font-size:13px;line-height:1.45;color:var(--ink2)">' + esc(r.title) + '</span><span class="muted" style="font-size:11.5px">' + attrShort(r) + '</span>' +

  function viewRecPanel(c) {
    var r = c.recs.filter(function (x) { return x.code === state.rid; })[0];

      '<div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Recomendación</span><span style="font-size:13.5px;line-height:1.55">' + esc(r.title) + '</span></div>' +
      '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#ECE9F2;border:1px solid #ECE9F2;border-radius:12px;overflow:hidden">' +

        '<span style="width:36px;height:36px;border-radius:50%;background:' + (pl.quad === 'qw' ? 'var(--purple)' : 'var(--teal)') + ';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0">' + pl.short + '</span>' +
        '<span style="flex-grow:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:13px;font-weight:700">' + pl.name + '</span><span class="muted" style="font-size:11.5px">' + pl.id + ' · Abrir plan</span></span></button>';
    } else if (r.isItgc) {
      body += '<span style="font-size:13px;line-height:1.5;color:var(--ink2)">No tiene plan propio: se cubre con los planes del diagnóstico de TI.</span>';

    }

    body += '<div style="display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--line2)"><button type="button" class="btn outline" ' + act('edit', r.code) + '>' + ICON.edit + 'Editar clasificación</button></div>';

  function viewForm() {
    var F = state.form;
    if (!F) { return ''; }
    var isNew = F.mode === 'new';
    var sugNow = sug(F.I, F.P);
    var lvl = function (key, labels) {
      return '<div role="group" aria-label="' + key + '" style="display:flex;gap:6px">' + ['A', 'M', 'B'].map(function (v) {
        var on = F[key] === v;
        return '<button type="button" class="pill sq10' + (on ? ' on' : '') + '" aria-pressed="' + on + '" ' + act('flvl', key + ':' + v) + ' style="flex:1 1 0;padding:0 8px">' + labels[v] + '</button>';
      }).join('') + '</div>';
    };
    var plansOfDiag = PLANS.filter(function (p) { return p.diag === F.diag; });
    var h = '<div style="position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(30,20,51,.55)">' +
      '<button type="button" aria-label="Cancelar" ' + act('close') + ' style="position:absolute;inset:0;padding:0;border:0;background:transparent;cursor:pointer"></button>' +
      '<div role="dialog" aria-modal="true" aria-label="' + (isNew ? 'Agregar recomendación' : 'Editar clasificación') + '" style="position:relative;width:100%;max-width:780px;max-height:100%;overflow-y:auto;background:#fff;border-radius:18px;box-shadow:0 24px 64px rgba(30,20,51,.3);display:flex;flex-direction:column">' +
      '<div style="padding:20px 24px;border-bottom:1px solid #ECE9F2;display:flex;align-items:center;gap:12px"><div style="flex-grow:1;display:flex;flex-direction:column;gap:2px"><span class="eyebrow teal">' + (isNew ? 'Nueva recomendación' : 'Editar ficha') + '</span>' +
      '<h2 style="font-size:20px;font-weight:700">' + (isNew ? 'Agregar recomendación' : 'Editar clasificación de ' + esc(F.code)) + '</h2></div>' +
      '<button type="button" id="panel-close" aria-label="Cerrar" ' + act('close') + ' style="width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center">' + ICON.close + '</button></div>' +
      '<div style="padding:20px 24px;display:flex;flex-direction:column;gap:18px">';
    if (isNew) {
      h += '<div class="field"><span class="lbl" id="f-diag">Diagnóstico</span><div role="group" aria-labelledby="f-diag" style="display:flex;flex-wrap:wrap;gap:8px">' +
        pills([['ci', 'Control Interno (COSO)'], ['ti', 'Tecnología de la Información']].map(function (o) { return { label: o[1], on: F.diag === o[0], act: 'fdiag', arg: o[0] }; })) + '</div></div>' +
        '<div class="field"><span class="lbl" id="f-group">Proceso relacionado</span><div role="group" aria-labelledby="f-group" style="display:flex;flex-wrap:wrap;gap:8px">' +
        pills(GROUPS[F.diag].map(function (g) { return { label: g.name, on: F.group === g.id, act: 'fgroup', arg: g.id }; })) + '</div></div>';
    } else {
      h += '<div style="padding:12px 14px;border-radius:12px;background:var(--bg);font-size:13px;color:var(--ink2)"><strong>' + esc(F.code) + '</strong> · ' + (F.diag === 'ci' ? 'Control Interno' : 'Tecnología de la Información') + ' · ' + GNAME[F.group] + '</div>';
    }
    h += '<div class="field"><label class="lbl" for="f-hallazgo">Hallazgo</label><textarea id="f-hallazgo" class="inp" data-field="hallazgo" rows="3" placeholder="Qué se observó: situación, evidencia y alcance.">' + esc(F.hallazgo) + '</textarea></div>' +
      '<div class="field"><label class="lbl" for="f-rec">Recomendación</label><textarea id="f-rec" class="inp" data-field="title" rows="3" placeholder="Qué se recomienda hacer, en lenguaje formal.">' + esc(F.title) + '</textarea></div>' +
      '<div class="grid-auto" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">' +
      '<div class="field"><span class="lbl">Impacto</span>' + lvl('I', IMP) + '</div>' +
      '<div class="field"><span class="lbl">Probabilidad de ocurrencia</span>' + lvl('P', LVL) + '</div>' +
      '<div class="field"><span class="lbl">Complejidad de implementación</span>' + lvl('C', LVL) + '</div></div>' +
      '<div class="field"><span class="lbl" id="f-crit">Criticidad</span><div role="group" aria-labelledby="f-crit" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">' +
      pills(['Alto', 'Medio', 'Bajo'].map(function (c) { return { label: c, on: F.crit === c, act: 'fcrit', arg: c }; }), 'sq10') +
      '<span class="muted" style="font-size:12px;padding-left:4px">Sugerida: ' + sugNow + ' (según impacto × probabilidad)</span></div></div>' +
      '<div class="field"><span class="lbl" id="f-plan">Plan de acción</span><div role="group" aria-labelledby="f-plan" style="display:flex;flex-wrap:wrap;gap:6px">' +

        return { label: o.label, title: o.title, on: (F.plan || '') === o.id, act: 'fplan', arg: o.id };
      }), 'sq10 sm') + '</div>' +
      '<span class="muted" style="font-size:12px">' + (F.plan ? esc(F.plan + ' · ' + PLAN_BY[F.plan].name) : 'Sin plan: aparecerá como alerta para considerarla en los siguientes planes.') + '</span></div>' +

      '</div>' +
      '<div style="padding:16px 24px;border-top:1px solid #ECE9F2;display:flex;flex-wrap:wrap;align-items:center;gap:10px"><span class="muted" style="flex-grow:1;font-size:12.5px">' + (isNew ? 'Se registrará como ' + nextCode(F.group) : 'Los cambios se reflejan en la matriz y los conteos.') + '</span>' +
      '<button type="button" class="btn ghost" ' + act('close') + '>Cancelar</button><button type="button" class="btn primary" ' + act('save') + '>' + (isNew ? 'Guardar recomendación' : 'Guardar cambios') + '</button></div>' +
      '</div></div>';
    return h;
  }

  /* ================= Render ================= */
  var app = document.getElementById('app');
  var lastPanel = null;

      '<div style="display:flex;align-items:center;gap:12px;flex-grow:1"><img src="logo.png" alt="Knowledge Consulting" style="height:42px;width:auto;display:block">' +
      '<span aria-hidden="true" style="width:1px;height:32px;background:var(--line)"></span><span class="muted" style="font-size:12.5px;line-height:1.35">Seguimiento de recomendaciones<br>Uso interno</span></div>' +
      '<span style="font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:#FFF3D6;color:#7A4F00">POC · Datos de ejemplo</span>' +
      '<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:#E6F4F3;color:var(--teal-d)">' + ICON.cal + 'Último corte: vie 23 oct 2026</span>' +
      '<a class="btn ghost" href="v2/" style="font-size:12px;text-decoration:none">Cambiar propuesta</a><button type="button" class="btn ghost" ' + act('reset') + ' style="font-size:12px">Restablecer demo</button></div></header>';
    h += '<section style="background:var(--purple-dd);color:#fff"><div class="wrap" style="padding-top:32px;padding-bottom:24px;display:flex;flex-direction:column;gap:14px">' +
      '<span style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mint)">Cliente minero · Proyecto SOX</span>' +
      '<h1 style="font-size:30px;line-height:1.2;font-weight:700">Seguimiento de recomendaciones y planes de acción</h1>' +
      '<p style="margin:0;font-size:14px;line-height:1.5;max-width:760px;color:#E9E2FB">Fortalecimiento Integral SOX · Fase 0 y 1. Una recomendación cuenta como cubierta cuando su evidencia fue cargada y validada por el equipo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px"><nav aria-label="Vistas" style="display:flex;flex-wrap:wrap;gap:8px;flex-grow:1">' + tabs.map(function (t) {
        var on = state.view === t[0];
        return '<button type="button" ' + act('view', t[0]) + (on ? ' aria-current="page"' : '') + ' style="min-height:44px;padding:0 18px;border-radius:999px;border:1px solid ' + (on ? '#fff' : 'rgba(255,255,255,.45)') + ';background:' + (on ? '#fff' : 'transparent') + ';color:' + (on ? 'var(--purple-dd)' : '#fff') + ';font-size:13px;font-weight:700;cursor:pointer">' + t[1] + '</button>';
      }).join('') + '</nav>' +
      '<button type="button" class="btn mint" ' + act('add', state.view === 'ti' ? 'ti' : 'ci') + '>' + ICON.plus + 'Agregar recomendación</button></div></div></section>';

    if (state.view === 'resumen') { h += viewResumen(c); }

    if (state.panel === 'plan') { h += viewPlanPanel(c); }
    if (state.panel === 'rec') { h += viewRecPanel(c); }
    if (state.panel === 'form') { h += viewForm(); }
    return h;

  function render() {
    var ae = document.activeElement;
    var fid = ae && ae.id ? ae.id : null;
    var ss = null, se = null;
    if (fid && typeof ae.selectionStart === 'number') { ss = ae.selectionStart; se = ae.selectionEnd; }
    app.innerHTML = html();
    document.body.style.overflow = state.panel ? 'hidden' : '';
    var panelKey = state.panel ? state.panel + ':' + (state.pid || state.rid || '') : null;
    if (fid && document.getElementById(fid)) {
      var el = document.getElementById(fid);
      el.focus();
      if (ss !== null && el.setSelectionRange) { try { el.setSelectionRange(ss, se); } catch (e) { /* ignorar */ } }
    } else if (panelKey && panelKey !== lastPanel) {
      var cb = document.getElementById('panel-close');
      if (cb) { cb.focus(); }
    }
    lastPanel = panelKey;
    persist();
  }

  /* ================= Acciones ================= */
  function openNew(diag) {
    var d = diag === 'ti' ? 'ti' : 'ci';
    var g = state.grp && state.grp.charAt(0) === (d === 'ci' ? 'c' : 't') ? state.grp : (d === 'ci' ? 'c1' : 't0');
    set({ panel: 'form', form: { mode: 'new', diag: d, group: g, hallazgo: '', title: '', I: 'A', P: 'M', C: 'M', crit: 'Alto', critTouched: false, plan: '', err: false } });
  }
  function setF(patch) { set({ form: Object.assign({}, state.form, patch) }); }
  var ACTIONS = {
    view: function (v) { set({ view: v, sub: 'plans', grp: null, panel: null }); window.scrollTo(0, 0); },
    recs: function (g) { set({ sub: 'recs', grp: g || null }); window.scrollTo(0, 0); },
    back: function () { set({ sub: 'plans', grp: null }); },
    grp: function (g) { set({ grp: g || null }); },
    plan: function (id) { set({ panel: 'plan', pid: id }); },
    rec: function (code) { set({ panel: 'rec', rid: code }); },
    close: function () { set({ panel: null, form: null }); },
    add: function (d) { openNew(d); },
    edit: function (code) {
      var r = allRecs().filter(function (x) { return x.code === code; })[0];
      if (!r) { return; }
      set({ panel: 'form', form: { mode: 'edit', code: code, diag: r.diag, group: r.group, hallazgo: r.hallazgo || '', title: r.title, I: r.I, P: r.P, C: r.C, crit: r.crit, critTouched: true, plan: r.plan || '', err: false } });
    },
    fdiag: function (d) { setF({ diag: d, group: d === 'ci' ? 'c1' : 't0', plan: '' }); },
    fgroup: function (g) { setF({ group: g }); },
    flvl: function (arg) {
      var k = arg.split(':')[0], v = arg.split(':')[1];
      var patch = {}; patch[k] = v;
      if ((k === 'I' || k === 'P') && !state.form.critTouched) { patch.crit = sug(k === 'I' ? v : state.form.I, k === 'P' ? v : state.form.P); }
      setF(patch);
    },
    fcrit: function (c) { setF({ crit: c, critTouched: c !== sug(state.form.I, state.form.P) }); },
    fplan: function (id) { setF({ plan: id || '' }); },
    save: function () {
      var F = state.form;
      if (!String(F.hallazgo).trim() || !String(F.title).trim()) { setF({ err: true }); return; }
      var fields = { hallazgo: String(F.hallazgo).trim(), title: String(F.title).trim(), I: F.I, P: F.P, C: F.C, crit: F.crit, plan: F.plan || null };
      if (F.mode === 'edit') {
        var edits = Object.assign({}, state.edits);
        edits[F.code] = Object.assign({}, edits[F.code] || {}, fields);
        set({ edits: edits, panel: 'rec', rid: F.code, form: null });
        return;
      }
      var code = nextCode(F.group);
      var rec = Object.assign({ code: code, diag: F.diag, group: F.group, init: 0, detail: [], isNew: true }, fields);
      var status = Object.assign({}, state.status); status[code] = 0;
      set({ added: state.added.concat([rec]), status: status, panel: 'rec', rid: code, form: null });
    },
    upload: function (code) {
      var files = Object.assign({}, state.files);
      files[code] = (files[code] || []).concat([{ name: 'Evidencia_' + code + '_demo.pdf', meta: 'Equipo Knowledge · ' + new Date().toLocaleDateString('es-PE', { day: 'numeric', month: 'short', year: 'numeric' }) + ' · pendiente de validar' }]);
      var status = Object.assign({}, state.status); status[code] = 2;
      set({ files: files, status: status });
    },
    validate: function (code) {
      if (!(state.files[code] || []).length) { return; }
      var status = Object.assign({}, state.status); status[code] = 3;
      set({ status: status });
    },
    devolver: function (code) { var status = Object.assign({}, state.status); status[code] = 1; set({ status: status }); },
    mview: function (v) { set({ mview: v }); },
    ms: function (v) { set({ ms: v }); },
    mx: function (v) { set({ mx: v }); },
    mcrit: function (v) { set({ mcrit: v }); },
    mplan: function (v) { set({ mplan: v }); },
    reset: function () {
      if (!window.confirm('¿Volver al estado inicial de la demo? Se borrarán las recomendaciones agregadas y los cambios hechos en este navegador.')) { return; }
      set({ status: initStatus(), files: initFiles(), added: [], edits: {}, panel: null, form: null });
    }
  };
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) { return; }
    var fn = ACTIONS[el.getAttribute('data-act')];
    if (fn) { fn(el.getAttribute('data-arg')); }
  });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.getAttribute('data-field') && state.form) { state.form[t.getAttribute('data-field')] = t.value; return; }
    if (t.id === 'mx-search') { state.q = t.value; render(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.panel) { set({ panel: null, form: null }); } });

  render();
})();
</script>
</body>
</html>
