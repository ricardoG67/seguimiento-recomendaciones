<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento de Recomendaciones</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: consola ejecutiva — sidebar fijo oscuro + lienzo claro; resumen arriba, detalle abajo */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --line:#E2E6EE; --line-2:#ECEFF5;
  --ink:#121A2C; --ink-2:#39435A; --muted:#677189;
  --accent:#2A4FD0; --accent-ink:#FFFFFF; --accent-soft:#E7ECFC; --accent-strong:#1D3AA6;
  --ti:#0D8481; --ti-soft:#DDF2F1;
  --side:#0F1729; --side-2:#18223A; --side-ink:#AEB8CE; --side-hi:#FFFFFF; --side-line:#222D48;
  --crit:#B92E55; --crit-soft:#FBE5EC; --warn:#A86A00; --warn-soft:#FFF1D6;
  --s0:#C3C9D5; --s1:#E0A12B; --s2:#7C66D9; --s3:#1F8A5B;
  --s0-bg:#EEF0F4; --s0-fg:#4D566B; --s1-bg:#FFF2D8; --s1-fg:#7A4E00; --s2-bg:#EEEAFC; --s2-fg:#4E37B0; --s3-bg:#DFF3E9; --s3-fg:#11663F;
  --lvA-bg:#FBE5EC; --lvA-fg:#8E1F42; --lvM-bg:#FFF2D8; --lvM-fg:#7A4E00; --lvB-bg:#E3F2EC; --lvB-fg:#1A6646;
  --shadow:0 1px 2px rgba(16,24,44,.05),0 4px 14px rgba(16,24,44,.04);
  --scrim:rgba(10,15,28,.5);
  --f-display:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1020; --surface:#131A2B; --surface-2:#182033; --line:#252F47; --line-2:#1E273C;
  --ink:#E7EBF4; --ink-2:#B9C2D6; --muted:#8C96AD;
  --accent:#7590FF; --accent-ink:#0B1020; --accent-soft:#1D2852; --accent-strong:#9AAEFF;
  --ti:#3FC1BC; --ti-soft:#10302F;
  --side:#080C18; --side-2:#131B2E; --side-ink:#97A2BA; --side-hi:#FFFFFF; --side-line:#1B2439;
  --crit:#F0708F; --crit-soft:#3A1824; --warn:#E8AF45; --warn-soft:#352812;
  --s0:#465068; --s1:#E3A73A; --s2:#9383EE; --s3:#3DB57D;
  --s0-bg:#222A3E; --s0-fg:#B3BBCE; --s1-bg:#36290F; --s1-fg:#F1C46E; --s2-bg:#2A2450; --s2-fg:#C3B8FF; --s3-bg:#123425; --s3-fg:#7FDCAE;
  --lvA-bg:#3A1824; --lvA-fg:#F4A3B8; --lvM-bg:#36290F; --lvM-fg:#F1C46E; --lvB-bg:#123425; --lvB-fg:#7FDCAE;
  --shadow:0 1px 2px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#131A2B; --surface-2:#182033; --line:#252F47; --line-2:#1E273C;
  --ink:#E7EBF4; --ink-2:#B9C2D6; --muted:#8C96AD;
  --accent:#7590FF; --accent-ink:#0B1020; --accent-soft:#1D2852; --accent-strong:#9AAEFF;
  --ti:#3FC1BC; --ti-soft:#10302F;
  --side:#080C18; --side-2:#131B2E; --side-ink:#97A2BA; --side-hi:#FFFFFF; --side-line:#1B2439;
  --crit:#F0708F; --crit-soft:#3A1824; --warn:#E8AF45; --warn-soft:#352812;
  --s0:#465068; --s1:#E3A73A; --s2:#9383EE; --s3:#3DB57D;
  --s0-bg:#222A3E; --s0-fg:#B3BBCE; --s1-bg:#36290F; --s1-fg:#F1C46E; --s2-bg:#2A2450; --s2-fg:#C3B8FF; --s3-bg:#123425; --s3-fg:#7FDCAE;
  --lvA-bg:#3A1824; --lvA-fg:#F4A3B8; --lvM-bg:#36290F; --lvM-fg:#F1C46E; --lvB-bg:#123425; --lvB-fg:#7FDCAE;
  --shadow:0 1px 2px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:0}
.muted{color:var(--muted)}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* Shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:22px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:12px}
.brand-logo{background:#FFFFFF;border-radius:10px;padding:9px 12px;display:flex;align-items:center}
.brand-logo img{height:26px;width:auto;display:block}
.brand-proj{display:flex;flex-direction:column;gap:2px;padding:0 4px}
.brand-proj b{color:var(--side-hi);font-size:13px;font-weight:700}
.brand-proj span{font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:10px 10px 6px;color:#6E7A95}
.nav button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--side-ink);font-size:13px;font-weight:600;text-align:left}
.nav button:hover{background:var(--side-2);color:var(--side-hi)}
.nav button[aria-current="page"]{background:var(--side-2);color:var(--side-hi);box-shadow:inset 2px 0 0 var(--accent)}
.nav button .n{margin-left:auto;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--side-line);color:var(--side-ink)}
.nav svg{flex-shrink:0;opacity:.85}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--side-2);font-size:12px}
.side-foot .row{display:flex;align-items:center;gap:8px}
.side-foot b{color:var(--side-hi)}
.tag-poc{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:#3A2D0E;color:#F4C766}
.linkbtn{border:0;background:transparent;padding:0;color:var(--side-ink);font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left}
.linkbtn:hover{color:var(--side-hi)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:14px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.topbar .ttl{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:2px}
.topbar h1{font-size:20px;font-weight:700;line-height:1.2}
.crumb{font-size:12px;color:var(--muted)}
.corte{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-2);padding:0 12px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.content{padding-block:24px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1440px;width:100%}

/* Primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.card-h h2{font-size:15px;font-weight:700}
.card-b{padding:18px 20px}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-strong)}
.btn.ok{background:var(--s3);color:#FFFFFF}
.btn.sec{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.sec:hover{border-color:var(--muted)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px}
.btn.danger{background:var(--crit);color:#FFFFFF}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{min-height:32px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.fpill{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:600}
.fpill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chip.s0{background:var(--s0-bg);color:var(--s0-fg)} .chip.s0 i{background:var(--s0)}
.chip.s1{background:var(--s1-bg);color:var(--s1-fg)} .chip.s1 i{background:var(--s1)}
.chip.s2{background:var(--s2-bg);color:var(--s2-fg)} .chip.s2 i{background:var(--s2)}
.chip.s3{background:var(--s3-bg);color:var(--s3-fg)} .chip.s3 i{background:var(--s3)}
.crit{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.crit.Alto{background:var(--crit);color:#FFFFFF}
.crit.Medio{background:var(--warn-soft);color:var(--warn)}
.crit.Bajo{background:var(--s0-bg);color:var(--s0-fg)}
.lv{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.lv.A{background:var(--lvA-bg);color:var(--lvA-fg)} .lv.M{background:var(--lvM-bg);color:var(--lvM-fg)} .lv.B{background:var(--lvB-bg);color:var(--lvB-fg)}
.dg{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:5px}
.dg.ci{background:var(--accent-soft);color:var(--accent)} .dg.ti{background:var(--ti-soft);color:var(--ti)}
.newtag{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--accent);color:var(--accent-ink)}
.prio{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--crit-soft);color:var(--crit)}
.bar{display:flex;gap:2px;height:10px;border-radius:3px;overflow:hidden;background:var(--line-2)}
.bar span{display:block;height:100%;min-width:2px}
.bar.lg{height:14px;border-radius:4px}
.prog{height:6px;border-radius:999px;background:var(--line-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--s3);border-radius:999px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.grid{display:grid;gap:16px}

/* Resumen */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0}
.hero-l{padding:22px 24px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line-2)}
.hero-r{padding:18px 20px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.big{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:.95;letter-spacing:-.03em}
.big small{font-size:28px;font-weight:700;margin-left:2px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--s3-bg);color:var(--s3-fg)}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:8px;text-align:left;border-left-width:1px}
button.kpi:hover{border-color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}
.kpi .v small{font-size:16px;font-weight:700;color:var(--muted)}
.kpi .d{font-size:12px;color:var(--muted);line-height:1.4}
.kpi.alert{border-color:color-mix(in srgb,var(--crit) 45%,var(--line));background:linear-gradient(var(--crit-soft),var(--crit-soft)) top/100% 3px no-repeat,var(--surface)}
.two{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.crow{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 46px;align-items:center;gap:12px;padding:7px 0}
.crow .nm{font-size:12.5px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .ct{font-size:12px;font-weight:700;text-align:right}
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:4px 0 6px;border-bottom:1px dashed var(--line)}
.dhead b{font-size:13px;font-weight:700}
.dhead .p{font-family:var(--f-display);font-size:18px;font-weight:800}
.att{display:flex;flex-direction:column}
.att-i{display:grid;grid-template-columns:4px minmax(0,1fr);gap:14px;padding:14px 20px;border-bottom:1px solid var(--line-2)}
.att-i:last-child{border-bottom:0}
.att-i .stripe{border-radius:4px}
.att-i .t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.att-i .t b{font-size:13px;font-weight:700}
.att-i .t .num{font-family:var(--f-display);font-size:20px;font-weight:800}
.att-i p{font-size:12px;color:var(--muted);margin-top:2px}
.codes{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.code{min-height:26px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.code:hover{border-color:var(--accent);color:var(--accent)}
.code i{width:6px;height:6px;border-radius:50%;display:inline-block}

/* Tablas */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.pname{display:flex;align-items:center;gap:12px;min-width:240px}
.pbadge{width:36px;height:36px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.pbadge.ci{background:var(--accent-soft);color:var(--accent)} .pbadge.ti{background:var(--ti-soft);color:var(--ti)}
.pname b{font-size:13px;font-weight:700;line-height:1.3;display:block}
.pname span{font-size:11.5px;color:var(--muted)}
.cell-prog{display:flex;align-items:center;gap:10px;min-width:150px}
.cell-prog .prog{flex:1 1 auto}
.cell-prog b{font-size:12px;min-width:34px;text-align:right}
.mx{min-width:1380px}
.mx td{vertical-align:top}
.mx .wide{min-width:260px;max-width:340px;line-height:1.45}
.pending{color:var(--muted);font-style:italic}
.empty{padding:32px 20px;text-align:center;color:var(--muted);font-size:13px}

/* Diagnóstico */
.dband{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:center;padding:22px 24px}
.dband .stats{display:flex;flex-wrap:wrap;gap:24px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.05}
.stat .l{font-size:11.5px;color:var(--muted)}
.comp{grid-template-columns:repeat(5,minmax(0,1fr))}
.compc{padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.compc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.compc .nm{font-size:13px;font-weight:700;line-height:1.3;min-height:34px}
.compc .v{font-family:var(--f-display);font-size:22px;font-weight:800}
.compc .v small{font-size:12px;font-weight:600;color:var(--muted)}
.alertbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;border-radius:10px;background:var(--crit-soft);color:var(--crit);border:1px solid color-mix(in srgb,var(--crit) 30%,transparent)}
.alertbar b{font-size:13px}
.quad{display:flex;flex-direction:column;gap:10px}
.qz{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.qz.qw{background:var(--accent-soft)} .qz.pe{background:var(--ti-soft)}
.qz h3{font-size:12.5px;font-weight:700}
.qz .bub{display:flex;flex-wrap:wrap;gap:10px}
.bubble{width:48px;height:48px;border-radius:50%;font-family:var(--f-mono);font-size:12px;font-weight:600;border:3px solid var(--s0);background:var(--surface);color:var(--ink)}
.bubble.any{border-color:var(--s1)}
.bubble.closed{border-color:var(--s3);background:var(--s3);color:#FFFFFF}
.bubble.prio{outline:2px dashed var(--crit);outline-offset:3px}

/* Heatmap */
.hm{display:grid;grid-template-columns:72px repeat(3,minmax(0,1fr));gap:6px}
.hm .ax{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;align-items:center}
.hm .axx{text-align:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.hc{min-height:120px;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.hc .z{display:flex;justify-content:space-between;gap:6px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hc .z b{font-size:14px;letter-spacing:0}
.hc .codes{margin-top:0}

/* Drawer & modal */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;justify-content:flex-end}
.scrim > .shut{position:absolute;inset:0;border:0;background:transparent;padding:0}
.drawer{position:relative;width:100%;max-width:560px;height:100%;overflow-y:auto;background:var(--surface);display:flex;flex-direction:column;box-shadow:-16px 0 48px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-h{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.dr-h .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dr-h h2{font-size:20px;font-weight:700;line-height:1.3}
.dr-b{padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.x{width:38px;height:38px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv div{padding:11px 14px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line-2)}
.kv div:nth-child(odd){border-right:1px solid var(--line-2)}
.kv div:nth-last-child(-n+2){border-bottom:0}
.kv span{font-size:11px;color:var(--muted)}
.kv b{font-size:13px}
.sect{display:flex;flex-direction:column;gap:8px}
.sect p{font-size:13.5px;line-height:1.6;max-width:65ch}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2)}
.file b{font-size:12.5px;font-weight:600;word-break:break-all;display:block}
.file span{font-size:11px;color:var(--muted)}
.recbox{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.recbox.cov{border-color:color-mix(in srgb,var(--s3) 40%,var(--line))}
.note{background:var(--surface-2);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.modal-wrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-wrap > .shut{position:absolute;inset:0;border:0;background:transparent;padding:0}
.modal{position:relative;width:100%;max-width:760px;max-height:100%;overflow-y:auto;background:var(--surface);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal.sm{max-width:440px}
.m-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.m-h > div{flex:1 1 auto;display:flex;flex-direction:column;gap:2px}
.m-h h2{font-size:18px;font-weight:700}
.m-b{padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.m-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.field{display:flex;flex-direction:column;gap:7px}
.field .lbl{font-size:12.5px;font-weight:700}
.inp{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;line-height:1.5}
textarea.inp{resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts.eq .opt{flex:1 1 0}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.err{font-size:12.5px;font-weight:600;color:var(--crit)}
.foot{font-size:11.5px;color:var(--muted);line-height:1.5;max-width:90ch}

#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;line-height:1.4;padding:7px 10px;border-radius:7px;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#tip b{font-weight:700}

/* Responsive */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.comp{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1040px){.hero{grid-template-columns:1fr}.hero-l{border-right:0;border-bottom:1px solid var(--line-2)}.two{grid-template-columns:1fr}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));z-index:6}
  .brand{flex-direction:row;align-items:center}
  .brand-logo{padding:6px 9px}.brand-logo img{height:20px}
  .brand-proj{display:none}
  .nav{flex-direction:row;overflow-x:auto;width:100%;order:3;gap:4px;padding-bottom:2px}
  .nav-lbl{display:none}
  .nav button{width:auto;white-space:nowrap;min-height:36px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
  .side-foot{display:none}
  .topbar{position:static;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .dband{grid-template-columns:1fr}
}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}.comp{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr}.big{font-size:52px}.crow{grid-template-columns:minmax(0,120px) minmax(0,1fr) 40px}.kv{grid-template-columns:1fr}.kv div:nth-child(odd){border-right:0}.kv div:nth-last-child(2){border-bottom:1px solid var(--line-2)}}
@media (prefers-reduced-motion:no-preference){.btn,.fpill,.code,.nav button{transition:background-color .15s,border-color .15s,color .15s}}

      detail: (DET[a[0]] || []).map(function (x) { return { t: x[0], sub: !!x[1] }; }), isNew: false };
  });
  var PLANS = P.map(function (a) { return { id: a[0], diag: a[1], short: a[2], name: a[3], desc: a[4], effort: a[5], quad: a[6], prio: a[7], note: a[8] }; });
  var PLAN_BY = {};
  PLANS.forEach(function (p) { PLAN_BY[p.id] = p; });
  var GNAME = {}, GFULL = {};
  GROUPS.ci.concat(GROUPS.ti).forEach(function (g) { GNAME[g.id] = g.name; GFULL[g.id] = g.n + ' · ' + g.name; });
  var IMP = { A: 'Alto', M: 'Medio', B: 'Bajo' };
  var LVL = { A: 'Alta', M: 'Media', B: 'Baja' };

  var DNAME = { ci: 'Control Interno', ti: 'Tecnología de la Información' };

  function initStatus() { var s = {}; BASE_RECS.forEach(function (r) { if (r.code !== 'ITGC') { s[r.code] = r.init; } }); return s; }
  function initFiles() { return JSON.parse(JSON.stringify(INIT_FILES)); }

  /* ===== Estado + persistencia local ===== */
  var KEY = 'knowledge-seguimiento-poc-v2';
  var VIEWS = ['resumen', 'ci', 'ti', 'planes', 'matriz'];
  var state = {
    view: 'resumen', grp: null, panel: null, pid: null, rid: null, form: null, confirm: false,
    pfil: 'all', mview: 'tabla', ms: 'all', mx: 'riesgo', mcrit: 'all', mplan: 'all', mst: 'all', q: '',
    status: initStatus(), files: initFiles(), added: [], edits: {}
  };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.status) { state.status = saved.status; state.files = saved.files || state.files; state.added = saved.added || []; state.edits = saved.edits || {}; }
  } catch (e) { /* sin almacenamiento */ }
  try { var hv = (location.hash || '').replace('#', ''); if (VIEWS.indexOf(hv) !== -1) { state.view = hv; } } catch (e) { /* ignorar */ }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify({ status: state.status, files: state.files, added: state.added, edits: state.edits })); } catch (e) { /* ignorar */ } }
  function set(patch) { Object.assign(state, patch); render(); }

  /* ===== Utilidades ===== */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pct(a, t) { return t ? Math.round(a / t * 100) : 0; }
  function act(name, arg) { return 'data-act="' + name + '"' + (arg != null ? ' data-arg="' + esc(arg) + '"' : ''); }
  function tip(t) { return ' data-tip="' + esc(t) + '"'; }
  function sug(I, Pr) { var v = { A: 3, M: 2, B: 1 }; var s = v[I] * v[Pr]; return s >= 6 ? 'Alto' : (s >= 3 ? 'Medio' : 'Bajo'); }
  function riskZone(I, Pr) { return 'Riesgo ' + sug(I, Pr).toLowerCase(); }
  function priorZone(I, C) {
    var hiI = I === 'A', hiC = C === 'A';
    if (hiI && !hiC) { return 'Quick win'; }
    if (hiI && hiC) { return 'Proyecto estratégico'; }
    if (!hiI && !hiC) { return 'Complementario'; }

  }
  function chip(st) { return '<span class="chip s' + st + '"><i></i>' + ST[st].long + '</span>'; }
  function critB(c) { return '<span class="crit ' + esc(c) + '">' + esc(c) + '</span>'; }
  function lv(k, lbl) { return '<span class="lv ' + k + '">' + lbl + '</span>'; }
  function dg(d) { return '<span class="dg ' + d + '">' + (d === 'ci' ? 'COSO' : 'TI') + '</span>'; }
  function prog(p) { return '<div class="prog"><span style="width:' + p + '%"></span></div>'; }
  function stackBar(counts, total, lg, label) {
    var segs = [3, 2, 1, 0].filter(function (o) { return counts[o] > 0; }).map(function (o) {
      return '<span style="flex:' + counts[o] + ' 1 0;background:' + SCOL[o] + '"' + tip('<b>' + ST[o].long + '</b><br>' + counts[o] + ' de ' + total + (label ? ' · ' + label : '')) + '></span>';
    }).join('');
    return '<div class="bar' + (lg ? ' lg' : '') + '" role="img" aria-label="' + [3, 2, 1, 0].map(function (o) { return ST[o].long + ' ' + counts[o]; }).join(', ') + '">' + segs + '</div>';
  }
  function legend(counts) {
    return '<div class="legend">' + [3, 2, 1, 0].map(function (o) { return '<span><i style="background:' + SCOL[o] + '"></i>' + ST[o].long + ' <b>' + counts[o] + '</b></span>'; }).join('') + '</div>';
  }
  function codeBtn(r) { return '<button type="button" class="code" ' + act('rec', r.code) + tip('<b>' + esc(r.code) + '</b> · ' + ST[r.st].long + '<br>' + esc(r.title)) + '><i style="background:' + SCOL[r.st] + '"></i>' + esc(r.code) + '</button>'; }
  function allRecs() {
    var apply = function (r) { var e = state.edits[r.code]; return e ? Object.assign({}, r, e) : r; };
    return BASE_RECS.map(apply).concat(state.added.map(apply));
  }
  function nextCode(group) {
    var pre = PREFIX[group], max = 0;
    allRecs().forEach(function (r) { if (r.code.indexOf(pre) === 0) { var n = parseInt(r.code.slice(pre.length), 10); if (!isNaN(n) && n > max) { max = n; } } });
    var num = max + 1;
    if (pre.indexOf('R-') === 0) { return pre + num; }
    return pre + (num < 10 ? '00' + num : (num < 100 ? '0' + num : String(num)));
  }
  function svg(d, w) { return '<svg aria-hidden="true" width="' + (w || 16) + '" height="' + (w || 16) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>'; }
  var I = {
    home: svg('<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'),
    ci: svg('<path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>'),
    ti: svg('<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>'),
    plans: svg('<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>'),
    mx: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>', 15),
    close: svg('<path d="M6 6l12 12M18 6L6 18"/>', 18),
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 15),
    warn: svg('<path d="M12 3l9.5 16.5h-19z"/><path d="M12 10v4M12 17h.01"/>', 18),
    file: svg('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>', 18),
    edit: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>', 15),
    cal: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', 14),
    up: svg('<path d="M7 14l5-5 5 5"/>', 13),
    arrow: svg('<path d="M9 6l6 6-6 6"/>', 14)
  };

  /* ===== Cálculos ===== */
  function compute() {
    var raw = allRecs();
    var tiVals = raw.filter(function (r) { return r.diag === 'ti'; }).map(function (r) { return state.status[r.code] || 0; });
    var itgc = tiVals.every(function (v) { return v === 3; }) ? 3 : (tiVals.some(function (v) { return v > 0; }) ? 1 : 0);
    var recs = raw.map(function (r) {
      var isItgc = r.code === 'ITGC';
      var st = isItgc ? itgc : (state.status[r.code] || 0);
      return Object.assign({}, r, { st: st, isItgc: isItgc, noPlan: !r.plan && !isItgc, groupName: GNAME[r.group] });
    });
    var plans = PLANS.map(function (p) {
      var rs = recs.filter(function (r) { return r.plan === p.id; });
      var cnt = [0, 0, 0, 0]; rs.forEach(function (r) { cnt[r.st] += 1; });
      var cov = cnt[3];
      var any = rs.some(function (r) { return r.st > 0; });
      var closed = rs.length > 0 && cov === rs.length;
      return Object.assign({}, p, { recs: rs, counts: cnt, cov: cov, tot: rs.length, closed: closed, any: any, stc: closed ? 3 : (any ? 1 : 0), stateLabel: closed ? 'Cerrado' : (any ? 'En curso' : 'No iniciado') });
    });
    function diag(d) {
      var rs = recs.filter(function (r) { return r.diag === d; });
      var counts = [0, 0, 0, 0]; rs.forEach(function (r) { counts[r.st] += 1; });
      var ps = plans.filter(function (x) { return x.diag === d; });
      return {
        key: d, recs: rs, counts: counts, plans: ps, noPlan: rs.filter(function (r) { return r.noPlan; }),
        closed: ps.filter(function (x) { return x.closed; }).length, pct: pct(counts[3], rs.length),
        eyebrow: d === 'ci' ? 'Diagnóstico 1 · Marco COSO' : 'Diagnóstico 2 · ITGC y Ciberseguridad',
        title: DNAME[d], groupWord: d === 'ci' ? 'componente' : 'proceso',
        cols: GROUPS[d].map(function (g) {
          var gr = rs.filter(function (r) { return r.group === g.id; });
          var c = [0, 0, 0, 0]; gr.forEach(function (r) { c[r.st] += 1; });
          return { g: g, recs: gr, counts: c, cov: c[3] };
        })
      };
    }
    var counts = [0, 0, 0, 0]; recs.forEach(function (r) { counts[r.st] += 1; });
    return { recs: recs, plans: plans, counts: counts, ci: diag('ci'), ti: diag('ti') };
  }

  /* ===== Gráfico de tendencia ===== */
  function trend(gp) {
    var pts = WEEKS.map(function (w) { return { l: w[0], v: w[1] }; }).concat([{ l: 'Hoy', v: gp, cur: true }]);
    var W = 560, H = 196, L = 36, Rr = 18, T = 18, B = 30;
    var maxV = Math.max.apply(null, pts.map(function (p) { return p.v; }));
    var top = Math.max(40, Math.ceil((maxV + 5) / 10) * 10);
    var x = function (i) { return L + i * (W - L - Rr) / (pts.length - 1); };
    var y = function (v) { return T + (H - T - B) * (1 - v / top); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Cumplimiento semanal: ' + pts.map(function (p) { return p.l + ' ' + p.v + '%'; }).join(', ') + '" style="display:block;overflow:visible">';
    for (var t = 0; t <= top; t += 10) {
      s += '<line x1="' + L + '" x2="' + (W - Rr) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--line-2)" stroke-width="1"' + (t === 0 ? '' : ' stroke-dasharray="3 4"') + '/>';
      s += '<text x="' + (L - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="var(--f-body)">' + t + '%</text>';
    }
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
    s += '<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>';
    s += '<path d="' + line + ' L' + x(pts.length - 1) + ' ' + y(0) + ' L' + x(0) + ' ' + y(0) + ' Z" fill="url(#ga)"/>';
    s += '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(function (p, i) {
      s += '<text x="' + x(i) + '" y="' + (H - 9) + '" text-anchor="middle" font-size="10.5" fill="' + (p.cur ? 'var(--ink)' : 'var(--muted)') + '" font-weight="' + (p.cur ? 700 : 500) + '" font-family="var(--f-body)">' + p.l + '</text>';
      if (p.cur) {
        s += '<circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.5"/>';
        s += '<text x="' + (x(i) - 10) + '" y="' + (y(p.v) - 12) + '" text-anchor="end" font-size="12" font-weight="800" fill="var(--ink)" font-family="var(--f-display)">' + p.v + '%</text>';
      } else {
        s += '<circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>';
      }
      var prev = i ? pts[i - 1].v : null;
      s += '<rect x="' + (x(i) - 30) + '" y="' + T + '" width="60" height="' + (H - T - B) + '" fill="transparent"' + tip('<b>' + (p.cur ? 'Estado actual' : 'Corte ' + p.l) + '</b><br>' + p.v + '% cubierto' + (prev != null ? ' · ' + (p.v - prev >= 0 ? '+' : '') + (p.v - prev) + ' pp' : '')) + '/>';
    });
    return s + '</svg>';
  }

  /* ===== Vistas ===== */
  function viewResumen(c) {
    var total = c.recs.length, covered = c.counts[3], gp = pct(covered, total);
    var last = WEEKS[WEEKS.length - 1][1], dlt = gp - last;
    var altoAll = c.recs.filter(function (r) { return r.crit === 'Alto'; });
    var altoPend = altoAll.filter(function (r) { return r.st !== 3; });
    var rev = c.recs.filter(function (r) { return r.st === 2; });
    var noPlan = c.recs.filter(function (r) { return r.noPlan; });
    var closedN = c.ci.closed + c.ti.closed;
    var crit = c.recs.filter(function (r) { return r.I === 'A' && r.P === 'A' && r.st !== 3 && !r.isItgc; });
    var prioOpen = c.plans.filter(function (p) { return p.prio && !p.closed; });

    var h = '<section class="card hero">' +
      '<div class="hero-l"><span class="eyebrow">Cumplimiento global</span>' +
      '<div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap"><span class="big">' + gp + '<small>%</small></span>' +
      '<span class="delta" style="margin-bottom:8px' + (dlt < 0 ? ';background:var(--crit-soft);color:var(--crit)' : '') + '">' + (dlt >= 0 ? I.up : '') + (dlt >= 0 ? '+' : '') + dlt + ' pp vs. corte anterior</span></div>' +
      '<p style="font-size:13px;color:var(--ink-2)"><b>' + covered + ' de ' + total + '</b> recomendaciones cubiertas con evidencia validada por el equipo.</p>' +
      stackBar(c.counts, total, true, 'total') + legend(c.counts) + '</div>' +
      '<div class="hero-r"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="eyebrow">Tendencia semanal</span><span class="muted" style="font-size:11.5px">Cortes de los viernes · % de recomendaciones cubiertas</span></div>' + trend(gp) + '</div>' +
      '</section>';

    h += '<section class="grid kpis">' +
      '<button type="button" class="card kpi" ' + act('view', 'planes') + '><span class="eyebrow">Planes cerrados</span><span class="v">' + closedN + ' <small>/ ' + c.plans.length + '</small></span>' + prog(pct(closedN, c.plans.length)) + '<span class="d">Control Interno ' + c.ci.closed + ' de 8 · TI ' + c.ti.closed + ' de 8</span></button>' +
      '<button type="button" class="card kpi" ' + act('mfilter', 'Alto') + '><span class="eyebrow">Criticidad alta pendiente</span><span class="v" style="color:var(--crit)">' + altoPend.length + ' <small>/ ' + altoAll.length + '</small></span><span class="d">Recomendaciones de criticidad Alta que aún no están cubiertas.</span></button>' +
      '<button type="button" class="card kpi" ' + act('mstatus', '2') + '><span class="eyebrow">Evidencias por validar</span><span class="v" style="color:var(--s2)">' + rev.length + '</span><span class="d">Cargadas y a la espera de validación del equipo.</span></button>' +
      '<button type="button" class="card kpi' + (noPlan.length ? ' alert' : '') + '" ' + act('mnoplan') + '><span class="eyebrow">Sin plan de acción</span><span class="v" style="color:' + (noPlan.length ? 'var(--crit)' : 'var(--s3)') + '">' + noPlan.length + '</span><span class="d">' + (noPlan.length ? 'Recomendaciones que no están cubiertas por ningún plan.' : 'Todas las recomendaciones tienen un plan asignado.') + '</span></button>' +
      '</section>';

    h += '<section class="grid two">';
    h += '<div class="card"><div class="card-h"><h2>Avance por componente y proceso</h2><span class="muted" style="font-size:11.5px">Cubiertas / total</span></div><div class="card-b" style="display:flex;flex-direction:column;gap:18px">';
    [c.ci, c.ti].forEach(function (d) {
      h += '<div><div class="dhead"><button type="button" class="linkbtn" style="color:var(--ink);text-decoration:none;font-size:13px;font-weight:700" ' + act('view', d.key) + '>' + dg(d.key) + ' &nbsp;' + d.title + '</button><span class="p">' + d.pct + '%</span></div>' +
        d.cols.map(function (col) {
          return '<div class="crow"><span class="nm" title="' + esc(col.g.name) + '">' + col.g.name + '</span>' + stackBar(col.counts, col.recs.length, false, col.g.name) + '<span class="ct">' + col.cov + '/' + col.recs.length + '</span></div>';
        }).join('') + '</div>';
    });
    h += '</div></div>';

    var att = [];
    if (noPlan.length) { att.push({ c: 'var(--crit)', t: 'Sin plan de acción', n: noPlan.length, d: 'Insumo para los siguientes planes: asígnalas a un plan o agrúpalas en uno nuevo.', recs: noPlan }); }
    att.push({ c: 'var(--crit)', t: 'Zona crítica sin cubrir', n: crit.length, d: 'Impacto alto y probabilidad alta. Son las que más exponen al cliente.', recs: crit });
    att.push({ c: 'var(--s2)', t: 'Evidencias por validar', n: rev.length, d: 'Revisa la evidencia cargada para marcarlas como cubiertas o devolverlas.', recs: rev });
    att.push({ c: 'var(--s1)', t: 'Planes prioritarios abiertos', n: prioOpen.length, d: 'Marcados como prioritarios en las láminas presentadas.', plans: prioOpen });
    h += '<div class="card"><div class="card-h"><h2>Requiere atención</h2><span class="muted" style="font-size:11.5px">Corte vie 23 oct</span></div><div class="att">' +
      att.map(function (a) {
        return '<div class="att-i"><span class="stripe" style="background:' + a.c + '"></span><div style="min-width:0"><div class="t"><b>' + a.t + '</b><span class="num">' + a.n + '</span></div><p>' + a.d + '</p>' +

          (a.plans && a.plans.length ? '<div class="codes">' + a.plans.map(function (p) { return '<button type="button" class="code" ' + act('plan', p.id) + tip('<b>' + p.id + '</b> · ' + p.cov + '/' + p.tot + ' cubiertas<br>' + esc(p.name)) + '><i style="background:' + SCOL[p.stc] + '"></i>' + p.id + '</button>'; }).join('') + '</div>' : '') +
          '</div></div>';
      }).join('') + '</div></div>';
    h += '</section>';

    h += '<section class="card"><div class="card-h"><h2>Planes de acción</h2><button type="button" class="btn sec sm" ' + act('view', 'planes') + '>Ver detalle de planes ' + I.arrow + '</button></div>' + plansTable(c.plans.slice().sort(function (a, b) { return (b.prio - a.prio) || (pct(a.cov, a.tot) - pct(b.cov, b.tot)); }), true) + '</section>';
    return h;
  }

  function plansTable(list, compact) {
    if (!list.length) { return '<div class="empty">No hay planes con este filtro.</div>'; }
    return '<div class="tbl-wrap"><table><thead><tr><th>Plan de acción</th><th>Diag.</th><th>Tipo</th>' + (compact ? '' : '<th>Esfuerzo</th>') + '<th>Recomendaciones</th><th>Avance</th><th>Estado</th></tr></thead><tbody>' +
      list.map(function (p) {
        return '<tr ' + act('plan', p.id) + ' tabindex="0"><td><div class="pname"><span class="pbadge ' + p.diag + '">' + p.short + '</span><div><b>' + esc(p.name) + '</b><span class="mono">' + p.id + '</span>' + (p.prio ? ' <span class="prio">Prioritario</span>' : '') + '</div></div></td>' +
          '<td>' + dg(p.diag) + '</td><td style="white-space:nowrap">' + (p.quad === 'qw' ? 'Quick win' : 'Estratégico') + '</td>' + (compact ? '' : '<td style="white-space:nowrap">' + p.effort + '</td>') +
          '<td style="min-width:120px">' + stackBar(p.counts, p.tot, false, p.id) + '</td>' +
          '<td><div class="cell-prog">' + prog(pct(p.cov, p.tot)) + '<b>' + p.cov + '/' + p.tot + '</b></div></td>' +
          '<td>' + '<span class="chip s' + p.stc + '"><i></i>' + p.stateLabel + '</span></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function quadCard(plans, note) {
    var qw = plans.filter(function (x) { return x.quad === 'qw'; }), pe = plans.filter(function (x) { return x.quad === 'pe'; });

    return '<div class="card"><div class="card-h"><h2>Matriz de priorización</h2></div><div class="card-b quad">' +

  }

  function recsTable(rows, scopeN, showDiag) {
    var h = '<div class="tbl-wrap"><table class="mx"><thead><tr><th>Código</th>' + (showDiag ? '<th>Diag.</th>' : '') + '<th>Proceso relacionado</th><th>Hallazgo</th><th>Recomendación</th><th>Criticidad</th><th>Impacto</th><th>Probabilidad</th><th>Complejidad</th><th>Plan</th><th>Estado</th></tr></thead><tbody>' +
      rows.map(function (r) {

  function viewDiag(d) {

  function viewMatriz(c) {

      '<div class="seg" role="group" aria-label="Vista">' + [['tabla', 'Tabla'], ['mapa', 'Mapa de calor']].map(function (v) { return '<button type="button" aria-pressed="' + ((isTable ? 'tabla' : 'mapa') === v[0]) + '" ' + act('mview', v[0]) + '>' + v[1] + '</button>'; }).join('') + '</div></div>' +

      h += fp('mcrit', [['all', 'Toda criticidad'], ['Alto', 'Alto'], ['Medio', 'Medio'], ['Bajo', 'Bajo']]) +
        fp('mst', [['all', 'Todo estado'], ['3', 'Cubiertas'], ['2', 'Por validar'], ['1', 'En curso'], ['0', 'No iniciado']]) +

    } else {
      h += '<div class="seg" role="group" aria-label="Tipo de mapa">' + [['riesgo', 'Impacto × Probabilidad'], ['prior', 'Impacto × Complejidad']].map(function (t) { return '<button type="button" aria-pressed="' + ((isRisk ? 'riesgo' : 'prior') === t[0]) + '" ' + act('mx', t[0]) + '>' + t[1] + '</button>'; }).join('') + '</div>';

        return true;
      });
      h += '<div style="padding:10px 20px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b style="color:var(--ink)">Mostrando ' + rows.length + ' de ' + scope.length + '</b><span>Clic en una fila para ver o editar la ficha</span></div>' + recsTable(rows, scope.length, true) + '</section>';

    var isNew = F.mode === 'new';
    var opts = function (list, key, eq) { return '<div class="opts' + (eq ? ' eq' : '') + '" role="group">' + list.map(function (o) { return '<button type="button" class="opt" aria-pressed="' + (String(F[key] || '') === o[0]) + '" ' + act(o[2], o[0]) + (o[3] ? ' title="' + esc(o[3]) + '"' : '') + '>' + o[1] + '</button>'; }).join('') + '</div>'; };
    var lvOpts = function (k, labels) { return opts(['A', 'M', 'B'].map(function (v) { return [v, labels[v], 'flvl:' + k]; }).map(function (o) { return [o[0], o[1], 'flvl', null]; }), k, true).replace(/data-arg="([AMB])"/g, 'data-arg="' + k + ':$1"'); };
    var plansOfDiag = PLANS.filter(function (p) { return p.diag === F.diag; });
    var h = '<div class="modal-wrap"><button type="button" class="shut" aria-label="Cancelar" ' + act('close') + '></button><div class="modal" role="dialog" aria-modal="true" aria-label="' + (isNew ? 'Agregar recomendación' : 'Editar clasificación') + '">' +
      '<div class="m-h"><div><span class="eyebrow">' + (isNew ? 'Nueva recomendación' : 'Editar ficha') + '</span><h2>' + (isNew ? 'Agregar recomendación' : 'Editar ' + esc(F.code)) + '</h2></div>' + xBtn() + '</div><div class="m-b">';
    if (isNew) {
      h += '<div class="field"><span class="lbl">Diagnóstico</span>' + opts([['ci', 'Control Interno (COSO)', 'fdiag'], ['ti', 'Tecnología de la Información', 'fdiag']], 'diag') + '</div>' +
        '<div class="field"><span class="lbl">Proceso relacionado</span>' + opts(GROUPS[F.diag].map(function (g) { return [g.id, g.name, 'fgroup']; }), 'group') + '</div>';
    } else {
      h += '<div class="note" style="flex-direction:row;flex-wrap:wrap;gap:6px 10px"><b class="mono">' + esc(F.code) + '</b><span>' + DNAME[F.diag] + ' · ' + GNAME[F.group] + '</span></div>';
    }
    h += '<div class="field"><label class="lbl" for="f-hallazgo">Hallazgo</label><textarea id="f-hallazgo" class="inp" data-field="hallazgo" rows="3" placeholder="Qué se observó: situación, evidencia y alcance.">' + esc(F.hallazgo) + '</textarea></div>' +
      '<div class="field"><label class="lbl" for="f-rec">Recomendación</label><textarea id="f-rec" class="inp" data-field="title" rows="3" placeholder="Qué se recomienda hacer, en lenguaje formal.">' + esc(F.title) + '</textarea></div>' +
      '<div class="three"><div class="field"><span class="lbl">Impacto</span>' + lvOpts('I', IMP) + '</div><div class="field"><span class="lbl">Probabilidad</span>' + lvOpts('P', LVL) + '</div><div class="field"><span class="lbl">Complejidad</span>' + lvOpts('C', LVL) + '</div></div>' +
      '<div class="field"><span class="lbl">Criticidad</span><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">' + opts([['Alto', 'Alto', 'fcrit'], ['Medio', 'Medio', 'fcrit'], ['Bajo', 'Bajo', 'fcrit']], 'crit') + '<span class="muted" style="font-size:12px">Sugerida: ' + sug(F.I, F.P) + ' (impacto × probabilidad)</span></div></div>' +
      '<div class="field"><span class="lbl">Plan de acción</span>' + opts([['', 'Sin plan aún', 'fplan', 'Queda como insumo para un plan nuevo']].concat(plansOfDiag.map(function (p) { return [p.id, p.id, 'fplan', p.name]; })), 'plan') +
      '<span class="muted" style="font-size:12px">' + (F.plan ? esc(F.plan + ' · ' + PLAN_BY[F.plan].name) : 'Sin plan: aparecerá como alerta para considerarla en los siguientes planes.') + '</span></div>' +
      (F.err ? '<span role="alert" class="err">Completa el hallazgo y la recomendación para guardar.</span>' : '') + '</div>' +
      '<div class="m-f"><span class="muted" style="flex:1 1 200px;font-size:12.5px">' + (isNew ? 'Se registrará como <b class="mono">' + nextCode(F.group) + '</b>' : 'Los cambios se reflejan en la matriz y en los conteos.') + '</span><button type="button" class="btn sec" ' + act('close') + '>Cancelar</button><button type="button" class="btn pri" ' + act('save') + '>' + (isNew ? 'Guardar recomendación' : 'Guardar cambios') + '</button></div></div></div>';
    return h;
  }

  function viewConfirm() {
    return '<div class="modal-wrap"><button type="button" class="shut" aria-label="Cancelar" ' + act('close') + '></button><div class="modal sm" role="dialog" aria-modal="true" aria-label="Restablecer demo">' +
      '<div class="m-h"><div><h2>¿Restablecer la demo?</h2></div>' + xBtn() + '</div><div class="m-b"><p style="font-size:13.5px;color:var(--ink-2)">Se borran las recomendaciones agregadas, las evidencias subidas y los cambios hechos en este navegador. Los datos vuelven al corte del 23 de octubre.</p></div>' +
      '<div class="m-f" style="justify-content:flex-end"><button type="button" class="btn sec" ' + act('close') + '>Cancelar</button><button type="button" class="btn danger" ' + act('resetok') + '>Restablecer</button></div></div></div>';
  }

  /* ===== Render ===== */
  var app = document.getElementById('app');
  var lastPanel = null;
  var TITLES = {
    resumen: ['Resumen ejecutivo', 'Estado consolidado de ambos diagnósticos'],
    ci: ['Control Interno', 'Diagnóstico 1 · Marco COSO · 5 componentes'],
    ti: ['Tecnología de la Información', 'Diagnóstico 2 · ITGC y Ciberseguridad · 5 procesos'],
    planes: ['Planes de acción', '16 planes · cobertura por recomendación'],
    matriz: ['Matriz de recomendaciones', 'Registro completo de hallazgos y clasificación']
  };
  function html() {
    var c = compute();
    var navItem = function (v, label, icon, n) { return '<button type="button" ' + act('view', v) + (state.view === v ? ' aria-current="page"' : '') + '>' + icon + '<span>' + label + '</span>' + (n != null ? '<span class="n">' + n + '</span>' : '') + '</button>'; };
    var t = TITLES[state.view];
    var h = '<div class="shell"><aside class="side">' +
      '<div class="brand"><div class="brand-logo"><img src="logo.png" alt="Knowledge Consulting"></div><div class="brand-proj"><b>Cliente minero · Proyecto SOX</b><span>Fortalecimiento Integral SOX · Fase 0 y 1</span></div></div>' +
      '<nav class="nav" aria-label="Vistas"><span class="nav-lbl">General</span>' + navItem('resumen', 'Resumen ejecutivo', I.home) +
      '<span class="nav-lbl">Diagnósticos</span>' + navItem('ci', 'Control Interno', I.ci, c.ci.recs.length) + navItem('ti', 'Tecnología de la Información', I.ti, c.ti.recs.length) +
      '<span class="nav-lbl">Gestión</span>' + navItem('planes', 'Planes de acción', I.plans, c.plans.length) + navItem('matriz', 'Matriz de recomendaciones', I.mx, c.recs.length) + '</nav>' +
      '<div class="side-foot"><span class="tag-poc">POC · datos de ejemplo</span><div class="row">' + I.cal + '<span>Último corte <b>vie 23 oct 2026</b></span></div><span>Actualización manual semanal · uso interno del equipo</span><button type="button" class="linkbtn" ' + act('reset') + '>Restablecer demo</button></div>' +
      '</aside><div class="main"><header class="topbar"><div class="ttl"><span class="crumb">Seguimiento de recomendaciones · ' + t[1] + '</span><h1>' + t[0] + '</h1></div>' +
      '<a class="btn sec" href="../" style="text-decoration:none">Cambiar propuesta</a><span class="corte">' + I.cal + 'Corte vie 23 oct 2026</span><button type="button" class="btn pri" ' + act('add', state.view === 'ti' ? 'ti' : 'ci') + '>' + I.plus + 'Agregar recomendación</button></header><main class="content">';
    if (state.view === 'resumen') { h += viewResumen(c); }
    else if (state.view === 'matriz') { h += viewMatriz(c); }
    else if (state.view === 'planes') { h += viewPlanes(c); }
    else { h += viewDiag(state.view === 'ti' ? c.ti : c.ci); }
    h += '<p class="foot">POC con datos anonimizados y de ejemplo (estados, evidencias y clasificaciones). Los cambios se guardan solo en este navegador; "Restablecer demo" vuelve al estado inicial.</p></main></div></div>';
    if (state.panel === 'plan') { h += viewPlanPanel(c); }
    if (state.panel === 'rec') { h += viewRecPanel(c); }
    if (state.panel === 'form') { h += viewForm(); }
    if (state.confirm) { h += viewConfirm(); }
    return h;
  }
  function render() {
    var ae = document.activeElement, fid = ae && ae.id ? ae.id : null, ss = null, se = null;
    if (fid && typeof ae.selectionStart === 'number') { ss = ae.selectionStart; se = ae.selectionEnd; }
    var scrollers = {};
    document.querySelectorAll('.drawer,.modal').forEach(function (el, i) { scrollers[i] = el.scrollTop; });
    app.innerHTML = html();
    hideTip();
    document.body.style.overflow = (state.panel || state.confirm) ? 'hidden' : '';
    var panelKey = state.panel ? state.panel + ':' + (state.pid || state.rid || '') : (state.confirm ? 'confirm' : null);
    if (panelKey && panelKey === lastPanel) { document.querySelectorAll('.drawer,.modal').forEach(function (el, i) { if (scrollers[i] != null) { el.scrollTop = scrollers[i]; } }); }
    if (fid && document.getElementById(fid)) {
      var el = document.getElementById(fid); el.focus();
      if (ss !== null && el.setSelectionRange) { try { el.setSelectionRange(ss, se); } catch (e) { /* ignorar */ } }
    } else if (panelKey && panelKey !== lastPanel) { var cb = document.getElementById('panel-close'); if (cb) { cb.focus(); } }
    lastPanel = panelKey;
    persist();
  }

  /* ===== Tooltip ===== */
  var tipEl = document.getElementById('tip');
  function hideTip() { tipEl.hidden = true; }
  function placeTip(x, y) {
    var w = tipEl.offsetWidth, hgt = tipEl.offsetHeight;
    var nx = Math.min(window.innerWidth - w - 8, x + 14), ny = y - hgt - 12;
    if (ny < 8) { ny = y + 18; }
    tipEl.style.left = Math.max(8, nx) + 'px'; tipEl.style.top = ny + 'px';
  }
  app.addEventListener('mouseover', function (e) { var t = e.target.closest('[data-tip]'); if (!t) { hideTip(); return; } tipEl.innerHTML = t.getAttribute('data-tip'); tipEl.hidden = false; placeTip(e.clientX, e.clientY); });
  app.addEventListener('mousemove', function (e) { if (!tipEl.hidden) { placeTip(e.clientX, e.clientY); } });
  app.addEventListener('mouseleave', hideTip);

  /* ===== Acciones ===== */
  function openNew(diag) {
    var d = diag === 'ti' ? 'ti' : 'ci';
    var g = state.grp && state.grp.charAt(0) === (d === 'ci' ? 'c' : 't') ? state.grp : (d === 'ci' ? 'c1' : 't0');
    set({ panel: 'form', form: { mode: 'new', diag: d, group: g, hallazgo: '', title: '', I: 'A', P: 'M', C: 'M', crit: 'Alto', critTouched: false, plan: '', err: false } });
  }
  function setF(patch) { set({ form: Object.assign({}, state.form, patch) }); }
  function goMatriz(patch) { set(Object.assign({ view: 'matriz', mview: 'tabla', ms: 'all', mcrit: 'all', mst: 'all', mplan: 'all', q: '', panel: null }, patch)); hashTo('matriz'); window.scrollTo(0, 0); }
  function hashTo(v) { try { history.replaceState(null, '', '#' + v); } catch (e) { /* ignorar */ } }
  var A = {
    view: function (v) { set({ view: v, grp: null, panel: null }); hashTo(v); window.scrollTo(0, 0); },
    grp: function (g) { set({ grp: g || null }); },
    plan: function (id) { set({ panel: 'plan', pid: id }); },
    rec: function (code) { set({ panel: 'rec', rid: code }); },
    close: function () { set({ panel: null, form: null, confirm: false }); },
    add: function (d) { openNew(d); },
    edit: function (code) {
      var r = allRecs().filter(function (x) { return x.code === code; })[0];
      if (!r) { return; }
      set({ panel: 'form', form: { mode: 'edit', code: code, diag: r.diag, group: r.group, hallazgo: r.hallazgo || '', title: r.title, I: r.I, P: r.P, C: r.C, crit: r.crit, critTouched: true, plan: r.plan || '', err: false } });
    },
    fdiag: function (d) { setF({ diag: d, group: d === 'ci' ? 'c1' : 't0', plan: '' }); },
    fgroup: function (g) { setF({ group: g }); },
    flvl: function (arg) {
      var k = arg.split(':')[0], v = arg.split(':')[1], patch = {}; patch[k] = v;
      if ((k === 'I' || k === 'P') && !state.form.critTouched) { patch.crit = sug(k === 'I' ? v : state.form.I, k === 'P' ? v : state.form.P); }
      setF(patch);
    },
    fcrit: function (c) { setF({ crit: c, critTouched: c !== sug(state.form.I, state.form.P) }); },
    fplan: function (id) { setF({ plan: id || '' }); },
    save: function () {
      var F = state.form;
      if (!String(F.hallazgo).trim() || !String(F.title).trim()) { setF({ err: true }); return; }
      var fields = { hallazgo: String(F.hallazgo).trim(), title: String(F.title).trim(), I: F.I, P: F.P, C: F.C, crit: F.crit, plan: F.plan || null };
      if (F.mode === 'edit') {
        var edits = Object.assign({}, state.edits); edits[F.code] = Object.assign({}, edits[F.code] || {}, fields);
        set({ edits: edits, panel: 'rec', rid: F.code, form: null }); return;
      }
      var code = nextCode(F.group);
      var rec = Object.assign({ code: code, diag: F.diag, group: F.group, init: 0, detail: [], isNew: true }, fields);
      var status = Object.assign({}, state.status); status[code] = 0;
      set({ added: state.added.concat([rec]), status: status, panel: 'rec', rid: code, form: null });
    },
    upload: function (code) {
      var files = Object.assign({}, state.files);
      files[code] = (files[code] || []).concat([{ name: 'Evidencia_' + code + '_demo.pdf', meta: 'Equipo Knowledge · ' + new Date().toLocaleDateString('es-PE', { day: 'numeric', month: 'short', year: 'numeric' }) + ' · pendiente de validar' }]);
      var status = Object.assign({}, state.status); status[code] = 2;
      set({ files: files, status: status });
    },
    validate: function (code) { if (!(state.files[code] || []).length) { return; } var s = Object.assign({}, state.status); s[code] = 3; set({ status: s }); },
    devolver: function (code) { var s = Object.assign({}, state.status); s[code] = 1; set({ status: s }); },
    pfil: function (v) { set({ pfil: v }); },
    mview: function (v) { set({ mview: v }); },
    ms: function (v) { set({ ms: v }); },
    mx: function (v) { set({ mx: v }); },
    mcrit: function (v) { set({ mcrit: v }); },
    mst: function (v) { set({ mst: v }); },
    mplan: function (v) { set({ mplan: v }); },
    mfilter: function (v) { goMatriz({ mcrit: v, mst: 'all' }); },
    mstatus: function (v) { goMatriz({ mst: v }); },
    mnoplan: function () { goMatriz({ mplan: 'none' }); },
    reset: function () { set({ confirm: true, panel: null, form: null }); },
    resetok: function () { set({ status: initStatus(), files: initFiles(), added: [], edits: {}, panel: null, form: null, confirm: false }); }
  };
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) { return; }
    var fn = A[el.getAttribute('data-act')];
    if (fn) { fn(el.getAttribute('data-arg')); }
  });
  app.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.tagName === 'TR' && e.target.hasAttribute('data-act')) { e.preventDefault(); e.target.click(); }
  });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.getAttribute('data-field') && state.form) { state.form[t.getAttribute('data-field')] = t.value; return; }
    if (t.id === 'mx-search') { state.q = t.value; render(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (state.panel || state.confirm)) { set({ panel: null, form: null, confirm: false }); } });
  render();
})();
</script>
</body>
</html>
